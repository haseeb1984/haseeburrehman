name: Capture approved live portfolio websites

on:
  push:
    branches:
      - portfolio/refresh-homepage-resume-nov-2026
    paths:
      - .github/workflows/capture-live-site-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/site-capture
          npm install --prefix /tmp/site-capture playwright
          npx --prefix /tmp/site-capture playwright install --with-deps chromium

      - name: Capture public pages (no form submissions or login attempts)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('/tmp/site-capture/node_modules/playwright');

          const sites = [
            ['junction-systems-home', 'https://juncsys.com/'],
            ['junction-systems-pos-demo', 'https://juncsys.com/pos-demo/'],
            ['junction-systems-store-demo', 'https://juncsys.com/store-demo/'],
            ['junctiontools', 'https://junctiontools.com/'],
            ['alora', 'https://alora.juncsys.com/'],
            ['faiz-chicago', 'https://www.faizchicago.com/'],
            ['faiz-chicago-sms', 'https://www.faizchicago.com/sms'],
            ['ecommerce-audit-agent', 'https://audit.juncsys.com/'],
            ['outreach-marketing-agent', 'https://outreach.juncsys.com/']
          ];

          (async () => {
            const outDir = path.join(process.cwd(), 'assets', 'img', 'projects');
            fs.mkdirSync(outDir, { recursive: true });
            const browser = await chromium.launch({ headless: true });
            const results = [];

            for (const [slug, url] of sites) {
              const page = await browser.newPage({
                viewport: { width: 1440, height: 1000 },
                deviceScaleFactor: 1
              });
              try {
                const response = await page.goto(url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                await page.waitForTimeout(2500);
                const status = response ? response.status() : null;
                const finalUrl = page.url();
                const title = await page.title().catch(() => '');
                if (status !== null && status < 400) {
                  const file = path.join(outDir, slug + '.jpg');
                  await page.screenshot({
                    path: file,
                    type: 'jpeg',
                    quality: 82,
                    fullPage: false,
                    animations: 'disabled'
                  });
                  results.push({ slug, url, finalUrl, status, title, screenshot: 'assets/img/projects/' + slug + '.jpg' });
                  console.log('CAPTURED', slug, status, finalUrl, title);
                } else {
                  results.push({ slug, url, finalUrl, status, title, screenshot: null, note: 'HTTP response was not successful' });
                  console.log('SKIPPED', slug, status, finalUrl);
                }
              } catch (error) {
                results.push({ slug, url, screenshot: null, error: String(error).slice(0, 500) });
                console.log('FAILED', slug, String(error).slice(0, 300));
              } finally {
                await page.close();
              }
            }

            await browser.close();
            fs.writeFileSync(
              path.join(outDir, 'manifest.json'),
              JSON.stringify({ capturedAt: new Date().toISOString(), results }, null, 2) + '\n'
            );
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-live-site-screenshots
          path: assets/img/projects/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit screenshots to portfolio branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/projects/
          if git diff --cached --quiet; then
            echo "No screenshot files changed."
            exit 0
          fi
          git commit -m "Add authentic screenshots of approved live portfolio sites"
          git push origin "HEAD:${GITHUB_REF_NAME}"
